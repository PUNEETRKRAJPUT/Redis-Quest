id: ch5-10-port-6379-is-on-the-internet
chapter: ch5
title: "Port 6379 is on the internet"
mode: cli

story: |
  `19:55  Mukul: "Funny thing. Port 6379 on your fest server answers me from the hostel wifi. No password. I only ran PING, I promise."`

  Mukul does not lie, which is the worrying part. The compose file Teja used for the fest server publishes `6379:6379` with no address in
  front, so the port is open on every network the machine is on, and a stock Redis asks nobody who they are. Your own stack
  publishes `127.0.0.1:6379:6379`, which only your Mac can reach. That one habit is the difference.

  A Redis open to the world is not a Redis that is slow tonight. It is a Redis that somebody else can `FLUSHALL`, or fill, or
  turn into a place to keep things. Lock the door, and then give the app a key that only opens the rooms it needs.

brainstorm:
  prompt: "Anybody who can reach the port can run any command. What is the right order of fixes?"
  options:
    - id: network-then-acl
      label: "First, make sure the port is not reachable from outside. Then give each client its own user with only the commands and keys it needs"
      is_reasonable: true
    - id: one-shared-password
      label: "Set one password and give it to everybody who needs Redis"
      is_reasonable: false
    - id: not-redis
      label: "Not Redis: move the game's data behind an API with its own auth and keep Redis on a private network only"
      is_reasonable: true

teach: |
  From the ACL page of the docs, and measured on this stack:

  - **Default user.** A new Redis has one user, `default`: on, no password, every key, every channel, every command. `ACL LIST` shows
    `user default on nopass sanitize-payload ~* &* +@all` on this Redis (the docs' example leaves out `sanitize-payload`). `requirepass` still
    works: it just sets that user's password. The docs say a stock Redis does not require authentication and listens on all
    interfaces. The Docker image has protected mode off: `CONFIG GET protected-mode` answers `no` here, and `CONFIG GET bind` answers `* -::*`.
  - **Rules** are read **left to right**: `on`, `>password`, `~pattern` (keys), `&pattern` (channels), `+command`, `-command`, `+@category`,
    `-@category`. A new user starts with nothing: no commands and no keys. `ACL CAT` lists the categories (`@read`, `@write`, `@dangerous`,
    `@fast`, `@slow`, ...); Redis 8 adds `@search`, `@json`, `@timeseries`, `@bloom`, `@cuckoo`, `@cms`, `@topk` and `@tdigest`.
  - The docs' example: a user with `~cached:* +get` can `GET cached:1` but `GET foo` fails with `NOPERM`, and `SET cached:1` fails because
    the command is not allowed.
  - **Use cases** the docs name: least privilege, and operational safety (a worker without `FLUSHALL`).
  - `AUTH <user> <password>` signs a connection in. Measured here: the default user has no password, so `AUTH default <anything>` answers `OK`.
  - Measured on this stack: for `worker` with `+@read +@write -@dangerous`, `ACL GETUSER` shows its commands as `-@all +@read +@write -@dangerous`.
    `FLUSHALL`, `KEYS`, `PING`, `ACL WHOAMI` and `CLIENT` are all refused for it, because they are in `@dangerous` or outside `@read` and `@write`.
    The refusal text names the user, which is how you tell who you are.

task: |
  Everything here goes in the game's Terminal panel, on the single node `redis://redis:6379`. The game keeps using the `default` user for its own
  reads and writes, so a user you sign in as only changes the terminal's connection.

  1. Look at the door: `CONFIG GET protected-mode`, `CONFIG GET bind`, `ACL LIST`, `ACL WHOAMI` (`default`).
  2. Make the worker: `ACL SETUSER worker on >hostelpass ~queue:* +@read +@write -@dangerous`. Run `ACL GETUSER worker` and read its commands and keys.
  3. Become the worker: `AUTH worker hostelpass`. **Before anything else**, run `ACL WHOAMI`: it is refused, and the error names `worker`. If it still
     says `default` the AUTH did not work: do not run the next two lines.
  4. As the worker: `SET queue:x 1` (OK), `GET queue:x`, `SET other 1` (NOPERM: not its key pattern), `FLUSHALL` (NOPERM: not its command).
  5. Come back: `AUTH default anything`, and `ACL WHOAMI` says `default` again.
  6. Answer the four questions below and press Verify.

hints:
  - "ACL SETUSER takes the user name and then the rules in order. >hostelpass sets the password, ~queue:* the keys, +@read +@write the commands to add, -@dangerous the ones to take away again. The order matters."
  - "ACL GETUSER shows commands as one string. If yours does not read -@all +@read +@write -@dangerous, the rules were given in a different order or with extra ones; ACL DELUSER worker and start again."
  - "If SET queue:x 1 is refused, check that you signed in with AUTH worker hostelpass and that the key really starts with queue:."
  - "After the worker part, run AUTH default anything. Every command is refused for the worker (even ACL WHOAMI), so stay as it only as long as you need to."

setup:
  - cmd: [ACL, DELUSER, worker]
  - cmd: [DEL, "queue:x", "other"]

verify:
  - type: redis
    checks:
      - cmd: [ACL, USERS]
        contains: worker
        message: "There is no user named worker. Create it with ACL SETUSER worker on >hostelpass ~queue:* +@read +@write -@dangerous."
      - cmd: [ACL, GETUSER, worker]
        contains: "-@all +@read +@write -@dangerous"
        message: "worker's commands should read -@all +@read +@write -@dangerous: read and write commands, with the dangerous ones (FLUSHALL, KEYS, CONFIG and friends) taken away again afterwards. Rules apply left to right."
      - cmd: [ACL, GETUSER, worker]
        contains: "~queue:*"
        message: "worker should only see keys matching ~queue:*."
  - type: quiz
    question: "Why create a worker user with an ACL instead of just setting requirepass?"
    options:
      - id: acl-least-privilege
        label: "requirepass only sets one password on the default user, so everyone who signs in can do everything. An ACL user can be limited to its keys and commands, so a leaked worker password cannot FLUSHALL"
      - id: requirepass-stronger
        label: "requirepass is weaker because the password is stored in plain text, while ACL passwords are encrypted on the wire"
      - id: acl-faster
        label: "ACL users are faster, since Redis skips its permission checks for them"
      - id: same-thing
        label: "They are the same thing: requirepass is just the old name of ACL SETUSER default"
    correct: acl-least-privilege
    explanation: "From the docs: requirepass still works, by setting the default user's password. That is one key to every room. ACL users give least privilege and operational safety, for example a worker without FLUSHALL. Neither encrypts traffic: that is TLS's job, and the answer to a public port is not a password anyway."
  - type: quiz
    question: "The rule string is +@read +@write -@dangerous. What would +@read -@dangerous +@write give?"
    options:
      - id: left-to-right
        label: "A different user: rules apply left to right, so +@write at the end adds the dangerous write commands (FLUSHALL, for one) back"
      - id: same-user
        label: "The same user: the order of rules never matters"
      - id: error
        label: "An error: a -@ rule must always come last"
      - id: nothing-written
        label: "A user who can read but not write, because -@dangerous cancels both categories"
    correct: left-to-right
    explanation: "The ACL page: rules apply left to right. +@write after -@dangerous puts back the commands that are in both categories, so FLUSHALL would be allowed again. That is why the check reads the exact commands string."
  - type: quiz
    question: "Which of these is the right first move when a Redis port turns out to be reachable from outside?"
    options:
      - id: not-on-the-internet
        label: "Close the port to the outside (bind it to the machine or a private network, firewall it), then add authentication and ACL users as the second layer"
      - id: set-requirepass-only
        label: "Set requirepass and leave the port open: a password is enough protection for a public database"
      - id: rename-port
        label: "Move Redis to another port number, which nobody will find"
      - id: tell-nobody
        label: "Do nothing until there is evidence of misuse, because Redis only answers known clients"
    correct: not-on-the-internet
    explanation: "The docs' security note: by default Redis requires no authentication and listens on all interfaces, and it should never be exposed to the internet. Network reach comes first; authentication and ACLs are the second wall. Your own compose file publishes 127.0.0.1:6379:6379 for that reason."
  - type: quiz
    question: "In Redis 8, which statement about ACL categories is right?"
    options:
      - id: redis8-categories
        label: "ACL CAT lists them; the classic ones are @read, @write, @dangerous, @fast and @slow, and Redis 8 adds categories for its bundled data types such as @search, @json, @timeseries and @bloom"
      - id: fixed-categories
        label: "There are exactly the same categories as in Redis 6, and the new data types have none"
      - id: per-user-categories
        label: "Categories are defined per user with ACL SETUSER and cannot be listed"
      - id: category-keys
        label: "A category names a set of keys, so +@read means every key can be read"
    correct: redis8-categories
    explanation: "ACL CAT lists the categories, and the 8.0 release adds ones for the bundled modules: @search, @json, @timeseries, @bloom, @cuckoo, @cms, @topk and @tdigest. A category names commands; keys are the ~patterns."

show_me:
  component: acl_users
  keys: []
docs:
  - https://redis.io/docs/latest/operate/oss_and_stack/management/security/acl/
  - https://redis.io/docs/latest/operate/oss_and_stack/management/admin/

reward:
  xp: 60
  badge: "Locked the door"

solutions:
  reference: solutions/10-reference.redis
  wrong:
    - path: solutions/10-wrong-all-commands.redis
      expect: wrong
      because: "+@all gives the worker every command, FLUSHALL included, and without -@dangerous the NOPERM the level is about never happens. A worker that can wipe the box is the default user with a different name. ACL GETUSER shows commands as +@all, not -@all +@read +@write -@dangerous."
