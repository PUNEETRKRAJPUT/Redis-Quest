id: ch1-04-fifty-roommates
chapter: ch1
title: "Fifty roommates"
mode: cli

story: |
  Teja got fifty of the hostel's most reliable people to register as a dry run, and they all did,
  within a minute of each other. Bunty was first, loudly. The numbering you promised the warden held.

  Now Harry Bhaiya wants to know how many of them have a profile. You could ask the database, but the
  profiles are keys in Redis, so you will have to walk the keyspace. On a laptop with a hundred keys
  any command works. On launch night, with real users, it will be a server that cannot afford to
  stop. Learn the safe way to look before you need it.

brainstorm:
  prompt: "Fifty keys today, a few hundred thousand on launch night. How do you find every key that starts with user:?"
  options:
    - id: scan-in-pages
      label: "Ask for them a page at a time, following a cursor until Redis says it is done"
      is_reasonable: true
    - id: keys-pattern
      label: "One command that returns every matching key at once"
      is_reasonable: false
    - id: not-redis
      label: "Not Redis: keep a separate list of user ids in Postgres and count that"
      is_reasonable: true

teach: |
  Two commands can list keys that match a pattern, and they behave very differently.

  - `KEYS pattern` walks the entire keyspace in one go and blocks the server while it does. The docs
    say not to use it in regular application code; it is for debugging and special operations only.
  - `SCAN cursor [MATCH pattern] [COUNT n]` returns a small batch and a new cursor. You start at
    cursor `0`, call again with the cursor you were given, and you are finished when the cursor
    comes back as `0`. It is incremental and safe on a busy server.

  The catch is that SCAN gives limited guarantees while keys are being added or removed, so treat
  it as "walk the keyspace", not "take a photograph".

  Patterns are globs: `h?llo` matches one character, `h*llo` any number, `h[ae]llo` a or e.

  A worked example from the docs, not your task:

      SCAN 0 MATCH "bike:*" COUNT 100

  COUNT is a hint for how much work to do per call, not a promise of how many keys come back.

task: |
  The fifty test profiles are hashes named `user:c1-001` to `user:c1-050`. They are already in your
  Redis; the game put them there when this level opened.

  Use `SCAN 0 MATCH user:c1-* COUNT 100`, then call it again with the cursor from each reply, until
  the cursor is `0`. Count the key names you collected, each name once, and type the number below.

  Do not use `KEYS` here, even though it would work on fifty keys. The habit is the lesson.

hints:
  - "Each reply carries the cursor to use next, alongside the batch of keys it found."
  - "If the cursor in a reply is not 0, call SCAN again with that cursor in place of the 0."
  - "Other keys that start with user: exist too, such as your own profile. The pattern user:c1-* leaves them out."

