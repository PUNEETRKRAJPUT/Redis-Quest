verify:
  - type: redis
    checks:
      - cmd: [EXISTS, "user:c1-001", "user:c1-050"]
        equals: 2
        message: "The fifty test profiles are no longer all there. Reopen the level to seed them again."
      - cmd: [SCARD, "ch1:users"]
        equals: 50
        message: "The reference set of test ids has changed. Reopen the level to seed it again."
  - type: answer
    prompt: "How many user:c1-* keys did SCAN find?"
    expected:
      cmd: [SCARD, "ch1:users"]
      transform: number
    compare: equals
    message: "That is not the number of test profiles. Keep calling SCAN with each new cursor until it returns 0, and count each key once."
  - type: quiz
    question: "A live Redis holds millions of keys and you must find those starting with user:. Which command do you reach for?"
    options:
      - id: scan-match
        label: "SCAN with MATCH, following the cursor until it returns 0"
      - id: keys-pattern
        label: "KEYS user:*, because it is one command"
      - id: get-each
        label: "GET each possible id, one after another, until one is missing"
    correct: scan-match
    explanation: "KEYS walks the whole keyspace in one go and blocks the server, so the docs keep it for debugging. SCAN does the same walk in small batches that a busy server can interleave with real traffic."

show_me:
  component: set_chips
  keys: ["ch1:users"]
docs:
  - https://redis.io/docs/latest/develop/using-commands/keyspace/

reward:
  xp: 25

solutions:
  reference: solutions/04-reference.redis
  wrong:
    - path: solutions/04-wrong-keys-command.redis
      expect: wrong
      because: "KEYS blocks the whole server while it walks every key. It finds the same fifty here, but nobody types an answer from it and on launch night it would freeze the app."
    - path: solutions/04-wrong-first-page-only.redis
      expect: wrong
      because: "One SCAN call is one page. Stopping before the cursor returns to 0 means you counted only the keys in the first batch."
