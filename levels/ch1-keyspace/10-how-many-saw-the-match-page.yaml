verify:
  - type: redis
    checks:
      - cmd: [PFCOUNT, "visitors:match:m-041"]
        between: [4, 6]
        message: "visitors:match:m-041 should estimate about five visitors. Add u-000001, u-000002, u-000003, u-000010 and u-000100 with PFADD."
      - cmd: [PFCOUNT, "visitors:match:all-live"]
        between: [950, 1060]
        message: "The merged count should be an estimate of about 1005. Merge both match sketches into visitors:match:all-live with PFMERGE."
      - cmd: [TYPE, "visitors:match:all-live"]
        equals: string
        message: "A HyperLogLog is stored as a string, so TYPE should say so. Did something other than PFMERGE write this key?"
  - type: quiz
    question: "The final will have tens of thousands of visitors. Which key keeps roughly the same small size as the audience grows, and what do you give up for it?"
    options:
      - id: hll-fixed-small-estimate
        label: "The HyperLogLog: a fixed small size, but you get only an estimate and cannot list who visited"
      - id: set-fixed-small-exact
        label: "The set: a fixed small size, and it can list exactly who visited"
      - id: both-grow-equally
        label: "Neither: both grow in step with the number of visitors"
    correct: hll-fixed-small-estimate
    explanation: "The docs put a HyperLogLog at up to 12 KB with a standard error of 0.81%. A set stores every member, so it grows with the audience, but it can tell you exactly who is in it."

show_me: hll_counter
docs:
  - https://redis.io/docs/latest/develop/data-types/probabilistic/hyperloglogs

reward:
  xp: 30

solutions:
  reference: solutions/10-reference.redis
  wrong:
    - path: solutions/10-wrong-no-merge.redis
      expect: wrong
      because: "The five m-041 visitors were recorded, but the two matches were never merged, so visitors:match:all-live does not exist and has no estimate."
    - path: solutions/10-wrong-pfadd-the-sketch-name.redis
      expect: wrong
      because: "PFADD adds items, not other sketches. Adding the key names as visitors gives an estimate of two, not about a thousand and five. PFMERGE is the command that combines sketches."
