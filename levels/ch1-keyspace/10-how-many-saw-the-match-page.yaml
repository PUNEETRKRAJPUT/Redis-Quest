id: ch1-10-how-many-saw-the-match-page
chapter: ch1
title: "How many people saw the match page"
mode: cli

story: |
  Harry Bhaiya has promised the fest sponsors a number: how many different people looked at the
  match page. Not page views, people. Somebody who opens the page forty times counts once.

  The obvious way to get that number is to keep a set of user ids per match and ask for its size.
  You try it on match m-042, which has already had a thousand visitors this evening, and the set is
  a thousand strings to tell you one number. On a final it would be tens of thousands of strings.
  The sponsors do not need to know who. They need to know roughly how many.

  The game has already recorded the m-042 visitors both ways. Look at what each one costs.

brainstorm:
  prompt: "You need the number of distinct visitors per match, close enough for a sponsor deck, without storing who they were. What would you use?"
  options:
    - id: hyperloglog
      label: "A structure that estimates how many different things it has seen, in a small fixed space"
      is_reasonable: true
    - id: set-of-user-ids
      label: "A set of user ids per match, then its size"
      is_reasonable: true
    - id: counter-per-view
      label: "INCR a counter on every page view"
      is_reasonable: false
    - id: not-redis
      label: "Not Redis: SELECT COUNT(DISTINCT user_id) from a page_views table"
      is_reasonable: true

teach: |
  A **HyperLogLog** estimates how many distinct items it has been shown. The docs give two figures: it
  uses up to 12 KB of memory, and its standard error is 0.81%. It is stored as a Redis string.

  - `PFADD key item [item ...]` shows items to the sketch. Seeing the same item again changes nothing.
  - `PFCOUNT key` returns the estimated number of distinct items. It runs in constant time.
  - `PFMERGE destination source [source ...]` combines sketches, so "all live matches" is a merge of
    "this match" and "that match".

  The trade: you get an estimate and nothing else, no list of who. The docs suggest it for anonymous
  unique visits per page, and note it avoids storing identifiers, which is "against the law in some
  countries".

  For scale, the docs' FAQ (64-bit): an empty instance is about 3 MB, one million small String keys
  about 85 MB, one million Hash keys with 5 fields about 160 MB. A set of visitors grows with the
  audience. A HyperLogLog does not.

  The docs' example, not your task: `PFADD bikes Hyperion Deimos Phoebe Quaoar`, then `PFCOUNT bikes`.

task: |
  The game has seeded `visitors:match:m-042` (a HyperLogLog) and `ch1:seen:m-042` (a plain set) with
  the same thousand visitor ids, `v-0001` to `v-1000`.

  1. Run `PFCOUNT visitors:match:m-042` and `SCARD ch1:seen:m-042`, then compare how much memory each
     key uses with `MEMORY USAGE visitors:match:m-042` and `MEMORY USAGE ch1:seen:m-042`.
  2. Match m-041 had five visitors: `u-000001`, `u-000002`, `u-000003`, `u-000010` and `u-000100`.
     Record them in `visitors:match:m-041` with `PFADD`.
  3. Merge both matches into `visitors:match:all-live` with `PFMERGE`, and read its estimate with
     `PFCOUNT`.
  4. Answer the question below.

hints:
  - "PFMERGE takes the destination first, then the sketches to merge into it."
  - "MEMORY USAGE prints a number of bytes. Compare the two numbers."
  - "No visitor appears in both matches, so the merged count should be about a thousand and five."

