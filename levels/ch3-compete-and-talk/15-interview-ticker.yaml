id: ch3-15-interview-ticker
chapter: ch3
title: "Interview: a ticker from a blank file"
mode: code

interview:
  minutes: 15
  rebuild_of: ch3-10-the-ticker
  hint_xp_cost: 10
  questions:
    - type: quiz
      question: "A phone loses signal for ten seconds in the middle of an over. When it comes back, what does it see?"
      options:
        - { id: tk1-replay, label: "Redis replays the balls it missed as soon as the phone subscribes again" }
        - { id: tk1-queued, label: "Redis queued the messages for that phone and delivers them in order" }
        - { id: tk1-error, label: "An error, until the page is reloaded" }
        - { id: tk1-last, label: "The broadcast is at-most-once, so the missed balls are gone for subscribers; the page reads the last-ball key to catch up to now, and a feed that must be complete needs a stream" }
      correct: tk1-last
      explanation: "Levels 3.10 and 3.11: pub/sub delivers to whoever is subscribed right now and keeps nothing (the pub/sub page: at-most-once). The last-ball key is the durable record the docs advise writing next to the publish, and the seq number tells a page how many balls it missed. A feed that cannot miss one belongs in a stream, which is the next chapter."
    - type: quiz
      question: "Your PUBLISH printed 0. Do you panic, or not?"
      options:
        - { id: tk2-failed, label: "The publish failed and nothing was sent" }
        - { id: tk2-nobody, label: "Nobody was subscribed to that channel at that moment; if it stays 0, suspect a typo in the channel name" }
        - { id: tk2-queued, label: "The message is waiting until a subscriber appears" }
        - { id: tk2-ok, label: "Nothing is wrong: 0 is the usual success reply" }
      correct: tk2-nobody
      explanation: "The pub/sub page: PUBLISH answers with the number of subscribers it reached, and a steady 0 usually means a typo in the channel name (level 3.10's third hint). Channels are not keys, so SCAN will not show them; PUBSUB NUMSUB will (level 3.11)."
    - type: quiz
      question: "Why does your subscriber get a connection of its own? One connection would be simpler."
      options:
        - { id: tk3-share, label: "It does not need one: node-redis shares a single connection for everything" }
        - { id: tk3-speed, label: "Subscriptions are faster on a separate connection" }
        - { id: tk3-login, label: "Subscribers must log in as a different user" }
        - { id: tk3-own, label: "A subscribed connection can do nothing but subscribe, unsubscribe and ping in the default protocol, so it takes client.duplicate()" }
      correct: tk3-own
      explanation: "The pub/sub page: a RESP2 subscribed client may only issue the subscribe commands and PING. In node-redis you duplicate the client, connect the copy and subscribe there (the node-redis guide). The same duplicate() gives a blocking command, such as BLMOVE, its own connection too."

story: |
  Third round, and the interviewer wants to see you ship a small thing end to end. "A ball is bowled. Every page that is open
  should hear about it at once. A page that opens a minute later should not be blank. Write the function that handles a ball.
  Then post one while I watch, and show me the page heard it."

  There is no teaching page open. If you like the file you have now, copy it to a safe name first.

brainstorm:
  prompt: "Before you type: how do the pages that are open hear about a ball, and how does a page that opens later learn the score?"
  options:
    - id: publish-and-keep-last
      label: "Publish the ball on a channel, and also store the last ball in a key with an expiry"
      is_reasonable: true
    - id: only-publish
      label: "Publish the ball on a channel and nothing else"
      is_reasonable: false
    - id: not-redis
      label: "Not Redis: each app copy pushes to its own connected pages"
      is_reasonable: true

task: |
  Design and implement the speaking half of a live ticker. Fill in `publish(deps, matchId, ball)` in
  `workspace/ch3/ticker-publish.js` from a blank file. `ball` is an object like `{ seq: 7, over: 2, ball: 1, runs: 6, batter: "p-028" }`.
  Return the reply of `PUBLISH`.

  - Broadcast the ball (as JSON, with `matchId` added) on the channel `score:match:<matchId>`.
  - Keep the same JSON in `score:match:<matchId>:last` for **3600** seconds, for pages that open later.

  The check calls your function for `m-041` and reads the key. Then turn on "Run my code in the app", press Verify, and while
  it waits post a ball:

      curl -s -X POST localhost:3000/app/matches/m-041/balls -H 'content-type: application/json' -d '{"seq":1,"over":1,"ball":1,"runs":4,"batter":"p-028"}'

hints:
  - "Pub/Sub keeps nothing for a subscriber that is not there. Where would a late page read the score from?"
  - "PUBLISH answers with how many subscribers it reached. A steady 0 usually means a typo in the channel."

verify:
  - type: behavior
    slot: ticker.publish
    fixtures: fixtures/15-clean-last.yaml
    assertions:
      - call:
          args:
            - "m-041"
            - { seq: 7, over: 2, ball: 1, runs: 6, batter: "p-028" }
        message: "ticker.publish for m-041 should leave the last ball in the key score:match:m-041:last, with a one hour expiry."
        sideEffect:
          - cmd: [GET, "score:match:m-041:last"]
            matches: '"seq":7'
            message: "score:match:m-041:last should hold the ball as JSON, including its seq. A page that opens late reads this key because a broadcast leaves nothing behind."
          - cmd: [TTL, "score:match:m-041:last"]
            between: [1, 3600]
            message: "score:match:m-041:last should expire within 3600 seconds (SET ... EX 3600), so an old match does not sit in Redis for ever."
  - type: event
    kind: channel_message
    match: { channel: "score:match:m-041" }
    timeoutMs: 120000
    message: "Nothing was published on score:match:m-041 while the checker waited. Turn on Run my code in the app, press Verify, and then post a ball with the curl command from the task. Check the channel name, and that the function really calls PUBLISH."

show_me:
  component: kv_card
  keys: ["score:match:m-041:last"]
docs:
  - https://redis.io/docs/latest/develop/pubsub/

reward:
  xp: 80
  badge: "Ticker, from memory"

solutions:
  reference: solutions/10-reference.js
  wrong:
    - path: solutions/10-wrong-no-publish.js
      expect: wrong
      because: "The last ball is stored but nothing is published, so pages that are already watching hear nothing and the app's subscriber receives zero messages."
    - path: solutions/10-wrong-wrong-channel.js
      expect: wrong
      because: "Published on score:m-041 instead of score:match:m-041. PUBLISH answers 0 receivers without complaining, and nobody is subscribed to that name."
