id: ch4
title: "Work in the background"
incident:
  - from: roommate
    time: "22:30"
    text: "bhai last over of the chase and the ticker just skipped ball 4. I restarted the points worker, ONE second 😭"
  - from: senior
    time: "22:32"
    text: "Scene kya hai? Forty thousand teams need points per ball. Two workers? Three? Fest ka budget hai"
  - from: roommate
    time: "22:34"
    text: "yaar now some batters have DOUBLE points. the old worker came back and did its balls again"
  - from: warden
    time: "22:36"
    text: "My nephew Bunty was given his prize points twice. Twice. Explain this before the chase ends."
  - from: roommate
    time: "22:39"
    text: "also the last slot in the hostel contest went to two people. TWO. how"
  - from: rival-college
    time: "22:41"
    text: "Nothing personal. Your server did a lot of work in the background tonight. Did it know it had already done it? 😏"
  - from: you
    time: "22:43"
    text: "the work has left the request. it needs a log that remembers, a queue that survives a crash, and a rule for repeats: once, even if told twice"
  - from: senior
    time: "22:45"
    text: "I do not follow but the last ball is soon. Please. Before the trophy, bhai"
