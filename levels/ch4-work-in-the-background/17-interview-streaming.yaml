id: ch4-17-interview-streaming
chapter: ch4
title: "Interview: stream recovery from a blank file"
mode: code

interview:
  minutes: 25
  rebuild_of: ch4-03-a-worker-died
  hint_xp_cost: 10

story: |
  The placement season has reached the interviewer who runs the data platform of a logistics company, and she has one scenario she gives everybody. "Our events go into a stream and two workers share them. In the middle of a batch one worker is killed. A day later we find that some events were never counted, and one event has been tried four hundred times. Rebuild the recovery. I will run it with a dead worker and a poison event."

  No chat to ask, no teaching page next to you. If you like the files you have now, copy them to safe names first. Then open the empty ones.

brainstorm:
  prompt: "Before you type: what does recovery need, and what is the one case that must not loop for ever?"
  options:
    - id: claim-idle-and-count
      label: "Claim entries that have been idle too long, process and acknowledge them, and count deliveries so a poison entry is moved aside"
      is_reasonable: true
    - id: replay-all
      label: "Replay the whole stream and add everything again"
      is_reasonable: false
    - id: not-redis
      label: "Not Redis: a heartbeat table in Postgres that reassigns events when a worker misses a beat"
      is_reasonable: false

task: |
  Write both functions from blank files: `consume(deps, matchId, consumer, count)` in `workspace/ch4/points-consume.js` and
  `sweep(deps, matchId, consumer, minIdleMs, maxDeliveries)` in `workspace/ch4/points-sweep.js`. Each gets `{ redis }` as `deps`.

  - The stream is `match:<matchId>:balls`, entries carry `over`, `ball`, `batter` and `runs`, and the consumer group is `points` (create it from `0-0` with
    `MKSTREAM` when it is missing and ignore `BUSYGROUP`). Points per batter go to the sorted set `lb:match:<matchId>`.
  - `consume` reads up to `count` never-delivered entries as `consumer`, adds each entry's runs to its batter, acknowledges it after that, and returns
    `{ processed: [<entry ids>] }`.
  - `sweep` takes over the group's entries idle for at least `minIdleMs` as `consumer`, and returns `{ reclaimed: [ids], deadLettered: [ids] }`. An entry delivered
    `maxDeliveries` times or more is copied to `match:<matchId>:balls:dead` (with a `reason`) and acknowledged on the original instead of processed; every other
    claimed entry is processed and acknowledged and listed in `reclaimed`.

  The check makes a worker `w2` take three of six balls and die, lets `w1` consume, and then sweeps.

hints:
  - "XAUTOCLAIM hands you the idle entries and bumps their delivery counter. XPENDING with a range of one id shows the counter."
  - "Acknowledge only after the points are added, and acknowledge a dead-lettered entry on the original stream too." 

verify:
  - type: behavior
    slot: points.consume
    fixtures: fixtures/17-w2-died.yaml
    assertions:
      - call: { args: ["m-041", "w1", 3] }
        expect: { processed: ["1700000000004-0", "1700000000005-0", "1700000000006-0"] }
        message: "w2 took balls 1 to 3 and died. w1 asking for 3 new balls should get balls 4, 5 and 6. The group already exists now, so creating it again answers BUSYGROUP: ignore that."
        sideEffect:
          - cmd:
              - EVAL_RO
              - "return redis.call('XPENDING', KEYS[1], ARGV[1])[1]"
              - 1
              - "match:m-041:balls"
              - points
            equals: 3
            message: "w2's three balls are still pending (they are not w1's to finish yet), so XPENDING should count 3. consume must only read new balls with the id > and must leave the pending ones alone."
  - type: behavior
    slot: points.sweep
    fixtures: fixtures/17-w2-died.yaml
    assertions:
      - call: { args: ["m-041", "w1", 0, 5] }
        expect:
          reclaimed: ["1700000000001-0", "1700000000002-0", "1700000000003-0"]
          deadLettered: []
        message: "w2's three balls have been idle at least 0 ms, so sweep as w1 should claim, process and report balls 1, 2 and 3 in reclaimed, and nothing in deadLettered."
        sideEffect:
          - cmd:
              - EVAL_RO
              - "return redis.call('XPENDING', KEYS[1], ARGV[1])[1]"
              - 1
              - "match:m-041:balls"
              - points
            equals: 0
            message: "After the sweep nothing should be pending: every claimed ball is processed and then acknowledged with XACK."
          - cmd: [ZSCORE, "lb:match:m-041", "p-028"]
            equals: 5
            message: "Balls 1 and 2 are p-028's, 4 + 1 = 5 points. If it is missing, the sweep never processed them; more than 5 means they were added twice."
          - cmd: [ZSCORE, "lb:match:m-041", "p-034"]
            equals: 6
            message: "Ball 3 is p-034's, 6 points."
  - type: quiz
    question: "Why does the production sweep pass a minimum idle time like 60000 ms to XAUTOCLAIM and not 0?"
    options:
      - id: redis-needs-it
        label: "XAUTOCLAIM refuses a minimum idle time below a minute"
      - id: faster-sweep
        label: "A larger number makes the sweep run faster"
      - id: ack-delay
        label: "It delays the acknowledgements so they can be batched"
      - id: only-take-from-the-silent
        label: "So it only takes entries from workers that have been silent a long time, and never steals a ball from a worker that is just busy on it"
    correct: only-take-from-the-silent
    explanation: "The idle time is how long since the entry was delivered, not whether the worker is alive. A short minimum would take balls away from a worker still finishing them, and two workers would then process the same ball. A minute is a trade: a dead worker's balls wait a minute, a busy worker is left alone. The check uses 0 only because it cannot wait."

show_me:
  component: stream_log
  keys: ["match:m-041:balls"]
docs:
  - https://redis.io/docs/latest/develop/data-types/streams/
  - https://redis.io/docs/latest/develop/use-cases/streaming

reward:
  xp: 90
  badge: "Recovery, from memory"

solutions:
  reference: solutions/03-reference.js
  wrong:
    - path: solutions/03-wrong-consume-only.js
      expect: wrong
      because: "sweep returns two empty lists and claims nothing. w2's three balls stay pending for ever and their points are never added."
    - path: solutions/03-wrong-xclaim-no-ack.js
      expect: wrong
      because: "sweep claims and processes the balls but never acknowledges them. They are still pending, now under w1's name, so the next sweep adds the same points again."
