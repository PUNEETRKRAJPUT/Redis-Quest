# Six balls, but ball 4 (1700000000004-0) is poison: its runs field is the text "x", which can never be added to a score.
# The group "points" exists and worker w2 read all six, then died. Ball 4 was then claimed four more times (XCLAIM bumps the
# delivery counter each time), so it has been delivered five times: once by XREADGROUP and four by XCLAIM. The others once.
steps:
  - cmd: [DEL, "match:m-041:balls", "match:m-041:balls:dead", "lb:match:m-041"]
  - cmd: [XADD, "match:m-041:balls", "1700000000001-0", over, 1, ball, 1, batter, p-028, runs, 4]
  - cmd: [XADD, "match:m-041:balls", "1700000000002-0", over, 1, ball, 2, batter, p-028, runs, 1]
  - cmd: [XADD, "match:m-041:balls", "1700000000003-0", over, 1, ball, 3, batter, p-034, runs, 6]
  - cmd: [XADD, "match:m-041:balls", "1700000000004-0", over, 1, ball, 4, batter, p-028, runs, x]
  - cmd: [XADD, "match:m-041:balls", "1700000000005-0", over, 1, ball, 5, batter, p-034, runs, 2]
  - cmd: [XADD, "match:m-041:balls", "1700000000006-0", over, 1, ball, 6, batter, p-028, runs, 6]
  - cmd: [XGROUP, CREATE, "match:m-041:balls", points, "0-0"]
  - cmd: [XREADGROUP, GROUP, points, w2, COUNT, 10, STREAMS, "match:m-041:balls", ">"]
  - cmd: [XCLAIM, "match:m-041:balls", points, w2, 0, "1700000000004-0"]
  - cmd: [XCLAIM, "match:m-041:balls", points, w2, 0, "1700000000004-0"]
  - cmd: [XCLAIM, "match:m-041:balls", points, w2, 0, "1700000000004-0"]
  - cmd: [XCLAIM, "match:m-041:balls", points, w2, 0, "1700000000004-0"]
