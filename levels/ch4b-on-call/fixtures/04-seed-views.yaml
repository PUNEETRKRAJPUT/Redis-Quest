# Leaves exactly 1,000 view:* keys, none with a TTL (view:u-000011:m-041 .. view:u-001010:m-041), and no
# view:u-000010:m-041. One EVAL: it removes every view:* key first (the traffic run leaves thousands behind), found with SCAN.
steps:
  - cmd:
      - EVAL
      - "local c = '0' repeat local r = redis.call('SCAN', c, 'MATCH', 'view:*', 'COUNT', 1000) c = r[1] for _, k in ipairs(r[2]) do redis.call('UNLINK', k) end until c == '0' for i = 11, 1010 do redis.call('SET', string.format('view:u-%06d:m-041', i), '2026-11-01T02:05:00.000Z') end return 1000"
      - 0
