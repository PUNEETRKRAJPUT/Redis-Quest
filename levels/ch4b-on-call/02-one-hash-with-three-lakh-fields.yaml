id: ch4b-02-one-hash-with-three-lakh-fields
chapter: ch4b
title: "One hash with three lakh fields"
mode: code

story: |
  `PAGER 02:08  redis latency: warning  (spikes, no pattern)`

  The second page, three minutes after the first. Redis answers, but every so often one command comes back slower than
  the rest, and every phone that happened to be in line behind it waits too. Teja has pasted the graph: a comb, not a
  slope. The hot-key fix from the first page is in, so it is not that.

  You know one thing that changed this evening. Every fan who taps "follow Mumbai Monsoon" becomes one field in one
  hash, `fans:t-01`, and tonight the franchise crossed three lakh followers. Nobody ever decided that one hash should hold
  all of them. Harry Bhaiya's cleanup script touches that key at the end of every season, and Teja's admin page reads it
  whole.

  Do not reach for a fix yet. Look at the key.

brainstorm:
  prompt: "One hash holds every follower of one franchise, three lakh fields. What do you expect to go wrong, and what do you do about it?"
  options:
    - id: split-buckets
      label: "Any command that touches the whole key (read it, expire it, delete it) is slow and blocks others. Spread the fields over many smaller hashes"
      is_reasonable: true
    - id: raise-listpack
      label: "Raise the hash's compact-encoding limit above 300,000 so Redis keeps it in its small form"
      is_reasonable: false
    - id: not-redis
      label: "Not Redis: a followers table in Postgres, one row per fan and franchise"
      is_reasonable: true

setup:
  - cmd:
      - EVAL
      - "local c = '0' repeat local r = redis.call('SCAN', c, 'MATCH', 'fans:t-01:*', 'COUNT', 1000) c = r[1] for _, k in ipairs(r[2]) do redis.call('UNLINK', k) end until c == '0' redis.call('UNLINK', 'fans:t-01') for i = 1, 300000 do redis.call('HSET', 'fans:t-01', 'u' .. i, '1') end return redis.call('HLEN', 'fans:t-01')"
      - 0
  - cmd: [CONFIG, RESETSTAT]

teach: |
  A **big key** is one key that holds a lot: a hash with three lakh fields, a list with millions of items. Each command on it
  is not slow because of Redis, it is slow because of the key: `HGETALL` is O(N) in the hash's fields (the hashes page says so),
  and so is anything else that has to visit every field.

  The diagnosis, from the terminal and from your own shell:

  - `MEMORY USAGE fans:t-01` answers in bytes. On this stack the hash with fields `u1` .. `u300000`, each holding `1`, reports
    15,180,435 bytes (about 14.5 MiB): one key.
  - `OBJECT ENCODING fans:t-01` says `hashtable`. The memory-optimization page gives the compact form's limit:
    `hash-max-listpack-entries 512` by default, and past it Redis converts the hash to its normal encoding on its own.
  - `HLEN fans:t-01` counts the fields in O(1): 300000.
  - `docker compose exec redis redis-cli --bigkeys` scans the keyspace with `SCAN` and reports the biggest key of each type; on
    this stack it prints `Biggest hash found so far "fans:t-01" with 300000 fields` and ends its summary with the same key.

  What a big key costs is measured, not guessed. On this stack removing this hash with `DEL` took the server about 10 ms (the
  slow log's own figure: 8,497 to 12,111 microseconds in nine tries). Removing it with `UNLINK` took 7 to 30
  microseconds: `UNLINK` takes the key out of the keyspace at once and leaves the freeing of the memory for later. Both
  are one command on the same hash, and one of them blocks every other client for about ten milliseconds.

  The fix is to stop having a big key: spread the fields over `<key>:<n>` hashes by a stable rule, using `HSCAN` to read the
  old one a page at a time, a pipeline to write each page, and `UNLINK` at the end. The buckets will still be `hashtable` (about
  4,700 fields each at 64 buckets is still over 512): splitting does not change the encoding, it changes how much any single
  command has to touch.

task: |
  The game has built `fans:t-01` for you: 300,000 fields `u1` .. `u300000`, each with the value `1`.

  **Step 1, see it.** In the game terminal: `MEMORY USAGE fans:t-01`, `OBJECT ENCODING fans:t-01`, `HLEN fans:t-01`. In your own
  terminal, from the repo: `docker compose exec redis redis-cli --bigkeys`. Do not run `HGETALL fans:t-01` unless you want to
  see three lakh fields scroll past.

  **Step 2, name it.** The first question in Verify asks what this fault is.

  **Step 3, fix it.** Fill in `splitBigKey(deps, key, buckets)` in `workspace/ch4b/split-big-key.js`. It moves every field of the
  hash `key` into `buckets` hashes named `<key>:0` .. `<key>:<buckets - 1>` (field `f` goes to bucket `hash(f) mod buckets`; use any
  hash that spreads the names so that every bucket gets some), then removes `key` with `UNLINK`, and returns
  `{ fields, buckets }`: how many fields it moved and how many bucket hashes it wrote.

  - Read with `HSCAN` and `COUNT: 1000`, one page at a time. Do not `HGETALL` the whole hash into memory.
  - Write each page to its buckets without waiting for each `HSET` before sending the next (one `Promise.all` per page is enough).
  - Remove the original with `UNLINK`, not `DEL`.

  Verify rebuilds the three-lakh hash, calls `splitBigKey("fans:t-01", 64)`, and expects `{ fields: 300000, buckets: 64 }`, no
  `fans:t-01` left, the 64 buckets summing to 300,000 fields, and `unlink` in `INFO commandstats`. Tick "Run my code in the
  app" and `POST /app/oncall/split` with `{ "key": "...", "buckets": 64 }` runs the same function.

hints:
  - "HSCAN with node-redis: const page = await redis.hScan(key, cursor, { COUNT: 1000 }); page.cursor is the next cursor (0 when done) and page.entries is a list of { field, value }."
  - "Group each page's entries by bucket first, then redis.hSet(`${key}:${n}`, objectOfFields) once per bucket: far fewer commands than one HSET per field."
  - "A hash that spreads names well: FNV-1a. let h = 0x811c9dc5; for each char: h ^= code; h = Math.imul(h, 0x01000193) >>> 0; bucket = h % buckets. (A multiply-by-31 hash left the 64 buckets between 1,870 and 7,619 fields apart on these names.)"
  - "redis.unlink(key) at the end. Verify reads INFO commandstats for cmdstat_unlink."

verify:
  - type: quiz
    question: "MEMORY USAGE fans:t-01 answers 15,180,435, OBJECT ENCODING says hashtable, HLEN says 300000, and --bigkeys names the same key as the biggest hash. Whole-key commands on it stall Redis for milliseconds. What is this?"
    options:
      - id: big-key
        label: "A big key: one key holds so much that any command that visits all of it is slow for everyone"
      - id: hot-key
        label: "A hot key: one key takes most of the traffic"
      - id: slow-script
        label: "A slow script: a Lua script holding the server"
      - id: no-ttl
        label: "Keys with no TTL: memory grows because nothing expires"
    correct: big-key
    explanation: "A big key is found by size: MEMORY USAGE, HLEN and --bigkeys all point at one key, and the damage is done by commands that touch every field (HGETALL, DEL, expiry, copying it to a replica). A hot key is found by traffic (INFO commandstats), a slow script by BUSY, and missing TTLs by INFO keyspace showing keys growing while expires stays flat."
  - type: behavior
    slot: oncall.splitBigKey
    fixtures: fixtures/02-big-hash.yaml
    assertions:
      - call: { args: ["fans:t-01", 64] }
        expect: { fields: 300000, buckets: 64 }
        message: "Splitting fans:t-01 into 64 buckets should move all 300,000 fields into 64 hashes named fans:t-01:0 .. fans:t-01:63."
        sideEffect:
          - cmd: [EXISTS, "fans:t-01"]
            equals: 0
            message: "The original hash fans:t-01 should be gone after the split (remove it with UNLINK)."
          - cmd:
              - EVAL_RO
              - "local n = 0 for i = 0, 63 do n = n + redis.call('HLEN', 'fans:t-01:' .. i) end return n"
              - 0
            equals: 300000
            message: "The 64 hashes fans:t-01:0 .. fans:t-01:63 should hold 300,000 fields between them. Some fields were lost or written twice, or a bucket has a different name."
  - type: redis
    checks:
      - cmd: [INFO, commandstats]
        matches: "cmdstat_unlink:calls=[1-9]"
        message: "The original hash should be removed with UNLINK. INFO commandstats shows no unlink call: a DEL of a hash this size holds the server for about 10 ms on this stack."

show_me:
  component: hash_card
  keys: ["fans:t-01:0"]
docs:
  - https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/memory-optimization/
  - https://redis.io/docs/latest/develop/data-types/hashes/

reward:
  xp: 60
  badge: "Cut the big key"

solutions:
  reference: solutions/02-reference.js
  wrong:
    - path: solutions/02-wrong-del.js
      expect: wrong
      because: "The split is right, but the original is removed with DEL. INFO commandstats has no unlink call, because a DEL of a hash this size makes the server do all the freeing before it answers anyone else: about 10 ms on this stack, against 7 to 30 microseconds for UNLINK."
